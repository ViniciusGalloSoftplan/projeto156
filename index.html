<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Serviços – Prefeitura Municipal de Piracicaba</title>
<link rel="icon" type="image/png" href="https://piracicaba.sp.gov.br/wp-content/uploads/2023/05/cropped-brasao-270x270.png">
<link rel="apple-touch-icon" href="https://piracicaba.sp.gov.br/wp-content/uploads/2023/05/cropped-brasao-270x270.png">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/iconify-icon@2/dist/iconify-icon.min.js"></script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<!-- HEADER -->
<header>
  <div class="logo">
    <img src="assets/images/logoPiraciacaba.png" alt="Logo Prefeitura de Piracicaba" class="logo-img">
    <div>
      <div class="logo-text">Portal de Serviços 156</div>
      <div class="logo-sub">Prefeitura do Municipio de Piracicaba </div>
    </div>
  </div>
  <div class="header-actions">
    <div class="channel-card">
      <a class="channel-option" href="tel:156" aria-label="Ligar para o 156">
        <div class="channel-icon phone" aria-hidden="true">
          <iconify-icon icon="ph:phone-call"></iconify-icon>
        </div>
        <div class="channel-text">
          <strong>Prefere ligar?</strong>
          <span>Disque 156 e fale com um atendente</span>
        </div>
      </a>
    </div>
  </div>
</header>

<div class="layout">
  <!-- BREADCRUMB -->
  <div class="breadcrumb">
    <div class="breadcrumb-content" id="breadcrumb">
      <span class="breadcrumb-item active" data-level="home">Início</span>
    </div>
  </div>
  <div class="search-bar-top">
    <div class="search-wrap">
      <button type="button" class="search-toggle" aria-label="Abrir busca" aria-expanded="false">
        <iconify-icon icon="ph:magnifying-glass" aria-hidden="true"></iconify-icon>
        <span>Buscar serviços...</span>
      </button>
      <span class="search-icon" aria-hidden="true"><iconify-icon icon="ph:magnifying-glass"></iconify-icon></span>
      <input type="text" id="searchInput" placeholder="Buscar serviços, assuntos ou categorias…" aria-label="Buscar serviços, assuntos ou categorias" autocomplete="off">
      <button type="button" class="search-close-btn" aria-label="Fechar busca">✕</button>
      <span class="search-count" id="searchCount"></span>
      <div class="autocomplete-dropdown" id="autocompleteDropdown"></div>
    </div>
  </div>

  <!-- MAIN -->
  <main id="main">
    <div class="hero-section">
      <div class="hero-brand">
        <img src="assets/images/logo156.png" alt="Logo 156" class="hero-brand-icon">
      </div>
    </div>
    <div class="featured-services-section">
      <div class="featured-section" id="featuredSection"></div>
    </div>
    <div class="categories-section">
      <div class="section-header">
        <div class="section-header-content">
          <div class="categories-header">
            <h2>Categorias de Serviços</h2>
          </div>
        </div>
      </div>
      <div class="category-grid" id="categoryGrid"></div>
    </div>
  </main>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Formulário</div>
      <button class="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <iframe class="modal-iframe" id="modalIframe" src=""></iframe>
    </div>
  </div>
</div>

<div class="footer-strip">
  <span>© 2026 Prefeitura Municipal de Piracicaba — SIP 156</span>
  <span>Todos os serviços disponíveis 24h</span>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/index.js"></script>
</body>
</html>
